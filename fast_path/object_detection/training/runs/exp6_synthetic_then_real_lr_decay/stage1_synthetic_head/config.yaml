# exp6 stage 1 of 4: SYNTHETIC HEAD. SANPO-Synthetic head-camera walks at about 5 fps, from the ADE20K model.
# train: train_head_5fps.txt = 34,836 frames (1,089 batches of 32 per epoch)
# val:   val_head_5fps.txt   =  3,768 frames (the head walks of the 155 synthetic validation walks,
#        data_code/sanpo/synthetic/validation_split/results/validation_walks.txt); best.pt is chosen on it
# Length: 7,900 optimizer steps = stage 2's length (25 epochs x 316 batches), with stage 2's learning-rate curve
# (schedule.reference) and validation every 316 steps (= stage 2's per-epoch validation).
model:
  weights: yolo26n-sem-ade20k.pt
  weights_from: null

data:
  yaml: "D:/My Projects/blind-guide/fast_path/object_detection/data/sanpo/sanpo_synthetic/views/semantic_v1_short352/data.yaml"
  train_list: train_head_5fps.txt
  val_list: val_head_5fps.txt
  train_fps: null
  extra_archives: []
  human_lists: null          # synthetic labels are all exact (no human / machine label sources)
  extra_validation: null

ultralytics:
  lr0: 0.002                  # peak learning rate of this stage (as the source experiment)
  epochs: 8                  # 8 x 1,089 = 8,712 >= 7,900: training STOPS at schedule.max_steps (7.25 epochs)
  warmup_epochs: 0.58        # Ultralytics' own warmup: round(0.58 x 1,089) = 632 steps = stage 2's 2 x 316
                             # (the reference curve below sets lr and momentum at every step anyway)

schedule:
  reference: {steps_per_epoch: 316, epochs: 25, warmup_epochs: 2}   # stage 2's curve, step for step
  max_steps: 7900            # = stage 2: 25 epochs x 316 steps

validation:
  every_steps: 316           # = stage 2's validation schedule (one real-head epoch)

modal:
  path_remap:
    data.yaml: "/data/sanpo_synthetic/views/semantic_v1_short352/data.yaml"
