# exp6 stage 4 of 4: REAL CHEST (the final model). SANPO-Real chest camera, from stage 3's best.pt.
# train: train.txt = 16,882 frames, 5 fps (528 batches of 32 per epoch); val: val.txt = 1,864 frames (12 walks)
# Same as exp2_start_ade20k EXCEPT lr0 = 0.00070710678 (1/sqrt(2) x stage 3, the lr decay of this experiment) and the starting
# weights (the shared_config.yaml recipe otherwise: 18 epochs, warmup 2, validation every
# epoch, val_human logged). Only this stage has test.py: its best.pt is scored on the
# test set and appears on the leaderboard as "exp6_synthetic_then_real_lr_decay".
model:
  weights_from: stage3_synthetic_chest

data:
  yaml: "D:/My Projects/blind-guide/fast_path/object_detection/data/sanpo/sanpo_real_chest/views/semantic_v1_short352/data.yaml"
  train_list: null
  val_list: null
  train_fps: null
  extra_archives: []
  human_lists: {val_human.txt: val.txt}
  extra_validation: {val_human: val_human.txt}

ultralytics:
  lr0: 0.00070710678          # peak learning rate of this stage (1/sqrt(2) x stage 3)
  epochs: 18                 # 18 x 528 = 9,504 steps
  warmup_epochs: 2           # 1,056 steps

schedule:
  reference: null
  max_steps: null

validation:
  every_steps: null          # every epoch (528 steps)

modal:
  path_remap:
    data.yaml: "/data/sanpo_real_chest/views/semantic_v1_short352/data.yaml"
