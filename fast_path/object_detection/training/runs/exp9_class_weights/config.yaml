# exp9_class_weights: experiment 9 (side experiment), CLASS WEIGHTS in the cross-entropy (ultralytics.cls_pw).
# EXACTLY exp2_start_ade20k (ADE20K start, full frames, lr 0.002, 18 epochs, batch 32, 5 fps, T4) except cls_pw 1.0:
# Ultralytics 8.4.208 weights class c by w_c = (1 / ln(1.02 + p_c)) ** cls_pw (ENet, arXiv:1606.02147), p_c = its share
# of the labeled pixels of all training masks, divided by the mean of the 29 weights; the main and auxiliary
# cross-entropy become weighted means over the labeled pixels; the dice loss is unchanged. cls_pw 1.0 = ENet's
# formula at full strength (0 = off, as every other run). The weights: results/train/class_weights.json.
# Everything else comes from ../../shared_config.yaml (md_files/decisions_for_training_yolo.md).
model:
  weights: yolo26n-sem-ade20k.pt

ultralytics:
  epochs: 18   # pinned (old default)
  warmup_epochs: 2   # pinned (old default)
  imgsz: 352
  lr0: 0.002
  cls_pw: 1.0          # THE change: class weights in the cross-entropy (0 = off)

modal:
  memory_gb: 32   # pinned (old default)
  gpu: "T4"            # 6.7 GB of GPU memory measured at batch 32 (full frames 640x352)

# Pinned when the shared default became the 10 fps recipe (exp4_frames_10fps), so this run stays
# reproducible with the settings it was trained with:
data:
  train_fps: null   # pinned (old default)
  extra_archives: []   # pinned (old default)
schedule:
  reference: null   # pinned (old default)
validation:
  every_steps: null   # pinned (old default)
