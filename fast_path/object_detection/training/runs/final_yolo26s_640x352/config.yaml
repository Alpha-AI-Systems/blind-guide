# final_yolo26s_640x352: FINAL RECIPE, YOLO26s-sem at 640x352 (one of the 4 released models: nano / small x 640x352 / 960x544).
# exp7_synthetic_mixed's recipe (the best on val among the 640x352 nano runs) with the winners of the other steps:
#   1. stage1_mix_head    real head at 10 fps (20,167 frames) + synthetic head (34,836, about 5 fps) <- yolo26s-sem-ade20k.pt
#   2. stage2_mix_chest   real chest at 10 fps (33,728) + synthetic chest (34,012, about 5 fps)      <- stage 1 best.pt
# Every batch of 32 = 16 real + 16 synthetic (data.mix). 10 fps = take 2, skip 1 of the 15 fps frames (exp4's winner);
# synthetic stays at about 5 fps (60% of its walks were rendered at 5 fps). Length and learning-rate curve = exp7's,
# step for step (schedule.reference; exp4's protocol for 10 fps): head 15,800 steps, chest 19,008; lr0 0.002 in both
# stages (decay across stages: worse on test in exp7_synthetic_mixed_lr_decay). Validation: the REAL val of each camera
# every 632 / 1,056 steps (= exp7's epochs); best.pt is chosen on it. Only stage 2 has test.py.
# Data: views semantic_v2_short352 (prepare_sanpo_real_modal.py: every labeled frame in tars/) and the synthetic
# semantic_v1_short352. 29 classes (exp8: 3 classes was a tie). Class weights on (cls_pw 1.0, exp9).
# lr 0.002 was tuned on nano at 640x352 (exp1) and kept for small and 960x544.
# Merge order of a stage: DEFAULTS < training/shared_config.yaml < THIS file < the stage's config.yaml.

model:
  weights: yolo26s-sem-ade20k.pt       # stage 1 starts from it; stage 2 from stage 1's best.pt (model.weights_from)

test:
  views:
    head: "D:/My Projects/blind-guide/fast_path/object_detection/data/sanpo/sanpo_real_head/views/semantic_v2_short352/data.yaml"

ultralytics:
  imgsz: 352
  lr0: 0.002
  batch: 32
  cls_pw: 1.0                # class weights (ENet, exp9_class_weights: val 0.3257 vs 0.3222 without, chosen on val)
  rect: true                 # full frames (as every run since exp2)
  cache: ram                 # head stage about 37 GB (56k frames x 0.66 MB), chest stage about 46 GB (70k frames)
  workers: 16                # as exp7 (2 workers per Modal core)

modal:
  gpu: "A100-40GB"
  cpu: 8                    # = workers / 2 (1 core = 2 vCPUs)
  timeout_hours: 24          # Modal's maximum; 34,808 steps in all (exp7 at 640x352 nano: about 1h40 of training)
  memory_gb: 96
  path_remap:
    test.views.head: "/data/sanpo_real_head/views/semantic_v2_short352/data.yaml"   # head test frames at this size
