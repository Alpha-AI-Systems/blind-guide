# exp3_imgsz736: experiment plan step 3 (image size), 1280x736 (frames 1309x736, full-frame batches 1312x736).
# Full frames (ultralytics.rect, the default since these runs), lr 0.002 (step 1 winner), 18 epochs, batch 32.
# Everything else comes from ../../shared_config.yaml (md_files/decisions_for_training_yolo.md).
model:
  weights: yolo26n-sem-ade20k.pt

data:
  train_fps: null   # pinned (old default)
  extra_archives: []   # pinned (old default)
  yaml: "D:/My Projects/blind-guide/fast_path/object_detection/data/sanpo/sanpo_real_chest/views/semantic_v1_short736/data.yaml"

ultralytics:
  epochs: 18   # pinned (old default)
  warmup_epochs: 2   # pinned (old default)
  imgsz: 736
  lr0: 0.002
  workers: 12
  cache: false               # the frames need about 55 GB of RAM at 736: decoded on the fly

modal:
  gpu: "A100"            # full frames at 736 need about 29 GB at batch 32: too much for an A10 (24 GB); A100 40 GB
  cpu: 6                     # = workers / 2
  memory_gb: 32
  path_remap:
    data.yaml: "/data/sanpo_real_chest/views/semantic_v1_short736/data.yaml"
    test.views.head: "/data/sanpo_real_head/views/semantic_v1_short736/data.yaml"   # head test frames at this size
                             # (made with prepare_sanpo_real_head_modal.py --image-sizes 736, on session 2)

test:
  batch: 32                  # test batch 128 ran out of GPU memory at 1312x736 on the T4

# Pinned when the shared default became the 10 fps recipe (exp4_frames_10fps), so this run stays
# reproducible with the settings it was trained with:
schedule:
  reference: null   # pinned (old default)
validation:
  every_steps: null   # pinned (old default)
