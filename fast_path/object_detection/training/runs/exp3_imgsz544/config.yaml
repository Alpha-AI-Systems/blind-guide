# Everything else comes from ../../shared_config.yaml (md_files/decisions_for_training_yolo.md).
model:
  weights: yolo26n-sem-ade20k.pt

data:
  yaml: "D:/My Projects/blind-guide/fast_path/object_detection/data/sanpo/sanpo_real_chest/views/semantic_v1_short544/data.yaml"

ultralytics:
  imgsz: 544
  lr0: 0.002
  workers: 12

modal:
