# shared_config.yaml - settings shared by every training run in runs/.
# Merge order: shared_training_code.DEFAULTS_YAML < this file < runs/<run>/config.yaml (the run wins).
# Every key and its meaning is listed in DEFAULTS_YAML at the top of shared_training_code.py;
# this file only states what this project sets for all runs. Decisions: md_files/decisions_for_training_yolo.md

model:
  weights: yolo26n-sem-ade20k.pt          # step 1 of the experiment plan starts from the ADE20K model
  weights_dir: "D:/My Projects/blind-guide/weights"   # local download folder for official weights

data:
  # Ultralytics dataset YAML of the SANPO semantic view (chest camera, 5 fps, official train split minus
  # the 12 validation walks; validation = the 12 walks). Made by data_code/sanpo/ (semantic view).
  yaml: "D:/My Projects/blind-guide/fast_path/object_detection/data/sanpo/sanpo_real_chest/views/semantic_v1_short352/data.yaml"
  validate_at_training_scale: true   # validate at the training scale (626x352), not Ultralytics' 352x198
  human_lists: {val_human.txt: val.txt}   # made after the data copy: the human-labeled frames of val.txt only
  annotation_types_dir: ../../sanpo_meta/annotation_types   # SANPO's label-source files (relative to the view)
  extra_validation: {val_human: val_human.txt}   # also validated every epoch (val_human_*); best.pt still uses val
  train_list: null           # null = data.yaml's train (5 fps); train_human.txt = human-labeled only
  train_fps: 10              # step 4 winner: 10 fps (take 2 of every 3 frames), picked from train_15fps.txt
                             # (5 / 10 / 15 possible; the 15 fps data is on sessions 2 and 3 only)
  extra_archives: [tars_15fps_extra]   # the 15 fps frames outside the 5 fps archives (needed for 10 and 15 fps)

ultralytics:
  epochs: 9                  # 10 fps: 1,054 batches x 9 = 9,486 steps = the step budget of the 5 fps runs
                             # (18 x 528); steps 2-3 used 18 epochs at 5 fps, the lr sweep 25
  batch: 32
  nbs: 32                    # nominal batch size; = batch: no gradient accumulation (Ultralytics' default nbs=64 would accumulate 2 batches)
  imgsz: 352                 # training sets the SHORT side: frames scaled to 626x352 (multiple of 32; the phone runs 640x352)
  optimizer: MuSGD
  lr0: 0.002                 # step 1 winner (chosen on val); exp1 runs set their own
  lrf: 0.01                  # cosine down to 1% of the peak
  cos_lr: true
  warmup_epochs: 1           # about 1,056 steps (overridden by schedule.reference anyway)
  mosaic: 0.05
  close_mosaic: 15           # mosaic only in the first 10 of 25 epochs
  scale: 0.25
  degrees: 3.0
  seed: 42
  deterministic: false       # true made the GPU about 4x slower (T4 test: 29 vs 109 img/s); the seed is still fixed
  rect: true                 # true = train on the WHOLE frame (640x352 at imgsz 352, 14 ignored columns) through
                             # Ultralytics' rect mode (mosaic/mixup/cutmix then off, shuffling stays on);
                             # false = Ultralytics' default: a CENTERED imgsz x imgsz square of each frame
  cache: ram                 # decode + resize every frame once, keep it in RAM (about 12 GB for train + val)
  workers: 8                 # data loader worker processes (2 per Modal CPU core = 1 per vCPU; frames are pre-resized)

dataloader:                  # built by the trainer subclass, so every setting is ours (ultralytics.workers above
                             # = training workers; batch and cache are in ultralytics: too)
  val_workers: null          # validation workers (null = the same as ultralytics.workers)
  val_batch_size: 32         # validation batch (Ultralytics: 2x the training batch = 64, which ran out of
                             # GPU memory at imgsz 544 on a T4); only speed and memory change, not the scores
  prefetch_factor: 4         # batches each training worker prepares ahead
  val_prefetch_factor: 2     # the same for validation
  pin_memory: true           # page-locked memory: faster copies to the GPU
  drop_last: false           # keep the last, smaller training batch of each epoch
  cap_workers_at_cpu_count: false   # true = never more workers than os.cpu_count()

schedule:
  reference: {steps_per_epoch: 528, epochs: 18, warmup_epochs: 2}   # the 5 fps runs' learning-rate curve,
                             # step for step, so runs of any epoch length share one curve (step 4)

validation:
  every_steps: 528           # = the 5 fps runs' validation schedule (one 5 fps epoch at batch 32)

logging:
  # extra validation scores: classes merged into groups, IoU per group + their mean, logged in val_log.csv
  # as val_group_<set>_<group> and val_group_<set>_mIoU. sanpo3 = the SANPO paper's on-device benchmark
  # (arXiv 2309.12172, Table 5 and Appendix A.6.1). Differences: the paper also puts "unlabeled" in
  # not_safe and "bus stop" in obstacle; we ignore both (no training labels).
  class_groups:
    sanpo3:
      safe: [sidewalk, crosswalk, paved trail, stairs, other walkable surface, terrain]
      not_safe: [road, curb, water body, inaccessible surface, railway track, sky]
      obstacle: [guard rail/road barrier, building, wall/fence, hand rail, opening-door, opening-gate,
                 pedestrian, rider, animal, obstacle, vehicle, traffic sign, traffic light, pole, bike rack,
                 tree, vegetation]
  unit: img
  console_log_every: 20
  ultralytics_progress_bars: false   # Ultralytics' own per-batch progress bars off (our lines show progress)
  diagnostics_every: 200

output:
  commit_every_steps: 50

test:                        # runs/<run>/test.py: scores the run's checkpoints (same code as the training validation)
  splits: {val: val.txt, val_human: val_human.txt, test_human: test_human.txt, test_all: test.txt}   # split -> list
  leaderboard_split: test_human   # runs/leaderboard.md is sorted by this split's mIoU (the SANPO paper's protocol)
  checkpoints: [best]        # only best.pt (chosen on val): never choose a checkpoint on the test set
  leaderboard_checkpoint: best   # only this checkpoint of each run appears in runs/leaderboard.md
  batch: 128                 # no training here: the batch only changes speed and memory, not the scores
  gpu: "T4"
  cpu: 4
  memory_gb: 16

modal:
  gpu: "T4"                  # smoke test: 5.4 GB peak GPU memory (T4 has 16 GB); the run is limited by data loading, not the GPU
  timeout_hours: 8
  cpu: 4                     # physical CPU cores reserved on Modal = half of ultralytics.workers (1 core = 2 vCPUs)
                             # ($0.0473 per core per hour)
  memory_gb: 48              # RAM reserved on Modal; the 10 fps RAM cache needs about 21 GB + Ultralytics' 50%
                             # margin ($0.008 per GB per hour)
  sync_checkpoints: true     # also download weights/best.pt and last.pt when the results sync home
  runs_volume: "blind-guide-runs"
  data_volume: "sanpo"
  data_mount: "/data"
  path_remap:
    data.yaml: "/data/sanpo_real_chest/views/semantic_v1_short352/data.yaml"
